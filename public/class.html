<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Теми класу — Математика онлайн</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/auto-render.min.js"></script>
</head>
<body>
<a class="skip" href="#main">Перейти до основного вмісту</a>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark" aria-hidden="true">∑</span> Математика онлайн</a>
    <nav class="nav" aria-label="Головна навігація">
      <a href="index.html">Головна</a>
      <a href="visuals.html">Візуалізації</a>
      <a href="trainer.html">Тренажер</a>
      <a href="progress.html">Мій прогрес</a>
      <a href="teacher.html">Для вчителя</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <nav class="crumbs" aria-label="Навігаційний ланцюжок">
      <a href="index.html">Головна</a><span>›</span><span id="crumb"></span>
    </nav>
    <h1 id="h"></h1>
    <div class="grid cols-2" id="list"></div>
  </div>
</main>

<footer class="site-foot"><div class="wrap">Освітній вебресурс із математики.</div></footer>

<script type="module">
import { byClass, CLASSES } from './data/topics.js';
import { el, $, qs, markNav, renderMath, ready, load, pct } from './js/core.js';

ready(() => {
  markNav();
  const c = Number(qs('c')) || CLASSES[0];
  document.title = `${c} клас — Математика онлайн`;
  $('#h').textContent = `${c} клас`;
  $('#crumb').textContent = `${c} клас`;

  const st = load();
  const list = $('#list');
  const topics = byClass(c);
  if (!topics.length) {
    list.append(el('p', { class: 'empty' }, 'Для цього класу матеріали ще не додано.'));
    return;
  }
  topics.forEach((t) => {
    const s = st.topics[t.id];
    const p = s ? pct(s.right, s.done) : 0;
    list.append(el('a', { class: 'card', href: `topic.html?t=${t.id}` },
      el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;align-items:center' },
        el('span', { class: 'tag' }, t.subject),
        s?.mastered ? el('span', { class: 'tag done' }, 'опановано') : null),
      el('h3', { style: 'margin-top:8px' }, t.title),
      el('p', {}, t.short),
      el('p', { style: 'margin-top:10px;font-size:.88rem' }, t.program),
      s?.done ? el('div', { style: 'margin-top:10px' },
        el('div', { class: 'bar' + (p >= 70 ? ' good' : p < 50 ? ' weak' : '') }, el('i', { style: `width:${p}%` })),
        el('p', { style: 'margin:6px 0 0;font-size:.85rem' }, `виконано ${s.done}, правильно ${p} %`)) : null));
  });
  renderMath();
});
</script>
</body>
</html>
